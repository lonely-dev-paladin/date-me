<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Will you go on a date with me?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ---------- Tokens ---------- */
      :root {
        --bg: #dcd0fb;
        --ink: #22143a;
        --paper: #fbf8ff;
        --muted: #5b4b78;
        --a: #b0124a;
        --a-ink: #ffffff;
        --b: #ffd866;
        --b-ink: #22143a;
        --c: #7fd6b0;
        --display:
          "Bricolage Grotesque", ui-rounded, "Trebuchet MS", system-ui,
          sans-serif;
        --body:
          "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto,
          sans-serif;
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #1b1030;
          --ink: #f5edff;
          --paper: #2a1b47;
          --muted: #bba9dd;
          --a: #ffb4c8;
          --a-ink: #2a0f1e;
          --b: #f7c948;
          --b-ink: #2a1b00;
          --c: #7b5ce0;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #1b1030;
        --ink: #f5edff;
        --paper: #2a1b47;
        --muted: #bba9dd;
        --a: #ffb4c8;
        --a-ink: #2a0f1e;
        --b: #f7c948;
        --b-ink: #2a1b00;
        --c: #7b5ce0;
        color-scheme: dark;
      }
      /* Invitation looks, chosen by the person sending the invite */
      :root[data-skin="lilac"] {
        --bg: #dcd0fb;
        --ink: #22143a;
        --paper: #fbf8ff;
        --muted: #5b4b78;
        --a: #b0124a;
        --a-ink: #ffffff;
        --b: #ffd866;
        --b-ink: #22143a;
        --c: #7fd6b0;
        color-scheme: light;
      }
      :root[data-skin="evening"] {
        --bg: #1b1030;
        --ink: #f5edff;
        --paper: #2a1b47;
        --muted: #bba9dd;
        --a: #ffb4c8;
        --a-ink: #2a0f1e;
        --b: #f7c948;
        --b-ink: #2a1b00;
        --c: #7b5ce0;
        color-scheme: dark;
      }
      :root[data-skin="garden"] {
        --bg: #cde8d8;
        --ink: #12301f;
        --paper: #f4fbf6;
        --muted: #3f6350;
        --a: #1f6b45;
        --a-ink: #ffffff;
        --b: #f4a6b7;
        --b-ink: #12301f;
        --c: #ffd866;
        color-scheme: light;
      }

      /* ---------- Base ---------- */
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      html {
        background: var(--bg);
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 400 1.0625rem/1.55 var(--body);
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      button,
      input,
      textarea {
        font: inherit;
        color: inherit;
      }
      h1,
      h2 {
        margin: 0;
      }
      h1 {
        font: 800 clamp(2.1rem, 8.5vw, 3.25rem)/1.03 var(--display);
        letter-spacing: -0.02em;
        margin: 0.25rem 0 1rem;
        text-wrap: balance;
      }
      h1:focus {
        outline: none;
      }
      h2 {
        font: 700 1.4rem/1.15 var(--display);
        letter-spacing: -0.01em;
        margin-bottom: 0.5rem;
      }
      p {
        margin: 0 0 1rem;
      }
      .lede {
        font-size: 1.15rem;
        max-width: 34ch;
      }
      .muted {
        color: var(--muted);
      }
      .hint {
        display: block;
        color: var(--muted);
        font-size: 0.92rem;
        font-weight: 400;
      }

      /* ---------- Paper-cut shapes ---------- */
      .shapes {
        position: fixed;
        inset: 0;
        overflow: hidden;
        z-index: 0;
        pointer-events: none;
        animation: shapesIn 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .sh {
        position: absolute;
        transition: transform 0.9s cubic-bezier(0.3, 0.8, 0.3, 1);
      }
      .sh1 {
        width: 72vmin;
        height: 72vmin;
        border-radius: 50%;
        background: var(--b);
        top: -24vmin;
        right: -26vmin;
      }
      .sh2 {
        width: 52vmin;
        height: 52vmin;
        bottom: -14vmin;
        left: -16vmin;
      }
      .sh3 {
        width: 40vmin;
        height: 20vmin;
        border-radius: 40vmin 40vmin 0 0;
        background: var(--c);
        bottom: 10vmin;
        right: -8vmin;
      }
      .sh4 {
        width: 24vmin;
        height: 24vmin;
        border-radius: 0 100% 0 100%;
        background: var(--a);
        top: 24vmin;
        left: -8vmin;
      }
      body[data-screen="invite"] .sh1 {
        transform: translate(-10vmin, 14vmin) scale(1.1);
      }
      body[data-screen="invite"] .sh2 {
        transform: translate(6vmin, -4vmin) rotate(25deg);
      }
      body[data-screen="invite"] .sh3 {
        transform: translate(-14vmin, -6vmin);
      }
      body[data-screen="invite"] .sh4 {
        transform: translate(10vmin, 8vmin) rotate(20deg);
      }
      body[data-screen="plan"] .sh1 {
        transform: translate(12vmin, 44vmin) scale(0.8);
      }
      body[data-screen="plan"] .sh2 {
        transform: translate(22vmin, -46vmin) rotate(-30deg) scale(0.8);
      }
      body[data-screen="plan"] .sh3 {
        transform: translate(-20vmin, -40vmin) rotate(-8deg);
      }
      body[data-screen="plan"] .sh4 {
        transform: translate(14vmin, 52vmin) rotate(-40deg);
      }
      body[data-screen="done"] .sh1 {
        transform: translate(-16vmin, 64vmin) scale(0.9);
      }
      body[data-screen="done"] .sh2 {
        transform: translate(30vmin, -8vmin) rotate(60deg) scale(1.1);
      }
      body[data-screen="done"] .sh3 {
        transform: translate(-30vmin, -30vmin);
      }
      body[data-screen="done"] .sh4 {
        transform: translate(4vmin, -6vmin) rotate(70deg) scale(1.3);
      }
      @keyframes shapesIn {
        from {
          opacity: 0;
          transform: scale(0.94);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* ---------- Layout ---------- */
      .wrap {
        position: relative;
        z-index: 1;
        max-width: 560px;
        margin: 0 auto;
        padding: 1.5rem 1rem 3.5rem;
      }
      .card {
        background: var(--paper);
        color: var(--ink);
        border: 2px solid var(--ink);
        border-radius: 28px;
        padding: 1.5rem 1.25rem;
        margin-bottom: 1rem;
      }
      .hero {
        padding: 0.5rem 0.25rem 1.25rem;
      }
      .foot {
        text-align: center;
        font-size: 0.95rem;
        margin-top: 1.25rem;
      }
      .foot a {
        color: var(--ink);
        font-weight: 600;
      }

      /* ---------- Buttons ---------- */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        padding: 0 1.5rem;
        border-radius: 999px;
        border: 2px solid var(--ink);
        background: var(--paper);
        color: var(--ink);
        font: 600 1.05rem/1 var(--body);
        cursor: pointer;
        text-decoration: none;
        box-shadow: 4px 4px 0 var(--ink);
        transition:
          transform 0.12s,
          box-shadow 0.12s;
      }
      .btn:active {
        transform: translate(3px, 3px);
        box-shadow: 1px 1px 0 var(--ink);
      }
      .btn.primary {
        background: var(--a);
        color: var(--a-ink);
      }
      .btn.big {
        width: 100%;
        min-height: 60px;
        font-size: 1.2rem;
      }
      .btn.small {
        min-height: 36px;
        padding: 0 0.9rem;
        font-size: 0.95rem;
        box-shadow: none;
      }
      .linkbtn {
        background: none;
        border: 0;
        padding: 0.5rem;
        cursor: pointer;
        color: var(--ink);
        font-weight: 500;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .btn:focus-visible,
      .chip:focus-visible,
      .tile:focus-visible,
      .skin:focus-visible,
      .linkbtn:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      a:focus-visible {
        outline: 3px solid var(--ink);
        outline-offset: 3px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.9rem;
        margin-top: 1.5rem;
      }
      .row .btn {
        flex: 1 1 auto;
      }
      .stack {
        display: grid;
        gap: 1rem;
        justify-items: center;
        margin-top: 1.75rem;
      }
      #nobtn {
        position: relative;
        transition:
          transform 0.2s ease-out,
          box-shadow 0.12s;
      }

      /* ---------- Form bits ---------- */
      .field {
        margin-bottom: 1.25rem;
      }
      fieldset {
        border: 0;
        padding: 0;
        margin: 0 0 1.25rem;
        min-width: 0;
      }
      label,
      legend {
        display: block;
        font-weight: 600;
        margin-bottom: 0.4rem;
        padding: 0;
      }
      input[type="text"],
      input[type="date"],
      textarea {
        width: 100%;
        background: var(--paper);
        color: var(--ink);
        border: 2px solid var(--ink);
        border-radius: 12px;
        padding: 0.75rem 0.9rem;
      }
      textarea {
        resize: vertical;
        min-height: 3.5rem;
      }
      input::placeholder,
      textarea::placeholder {
        color: var(--muted);
        opacity: 1;
      }
      .check {
        display: flex;
        gap: 0.7rem;
        align-items: flex-start;
        font-weight: 500;
        margin-bottom: 1rem;
      }
      .check input {
        width: 22px;
        height: 22px;
        margin: 0.1rem 0 0;
        accent-color: var(--a);
        flex: none;
      }
      .error {
        color: var(--ink);
        font-weight: 600;
        min-height: 1.5rem;
        margin: 0.5rem 0 0;
      }
      .error:not(:empty) {
        background: var(--b);
        color: var(--b-ink);
        padding: 0.5rem 0.8rem;
        border-radius: 10px;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .chip {
        min-height: 44px;
        padding: 0.65rem 1rem;
        border-radius: 999px;
        border: 2px solid var(--ink);
        background: transparent;
        color: var(--ink);
        font: 500 1rem/1.1 var(--body);
        cursor: pointer;
      }
      .chip[aria-pressed="true"] {
        background: var(--ink);
        color: var(--paper);
      }
      .tiles {
        display: grid;
        gap: 0.75rem;
        margin-bottom: 1.5rem;
      }
      .tile {
        text-align: left;
        padding: 0.9rem 1rem;
        border: 2px solid var(--ink);
        border-radius: 16px;
        background: var(--paper);
        color: var(--ink);
        cursor: pointer;
        box-shadow: 3px 3px 0 var(--ink);
      }
      .tile b {
        display: block;
        font: 700 1.1rem/1.2 var(--display);
      }
      .tile span {
        color: var(--muted);
        font-size: 0.95rem;
      }
      .tile[aria-pressed="true"] {
        background: var(--b);
        color: var(--b-ink);
      }
      .tile[aria-pressed="true"] span {
        color: var(--b-ink);
      }
      .skins {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .skin {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        min-height: 44px;
        padding: 0.4rem 0.9rem 0.4rem 0.5rem;
        border: 2px solid var(--ink);
        border-radius: 999px;
        background: transparent;
        color: var(--ink);
        font-weight: 500;
        cursor: pointer;
      }
      .skin[aria-pressed="true"] {
        background: var(--ink);
        color: var(--paper);
      }
      .dots {
        display: inline-flex;
      }
      .dots i {
        width: 16px;
        height: 28px;
        display: block;
      }
      .dots i:first-child {
        border-radius: 14px 0 0 14px;
      }
      .dots i:last-child {
        border-radius: 0 14px 14px 0;
      }

      /* ---------- Invitation ---------- */
      .invite .to {
        font-size: 1.1rem;
        margin: 0;
      }
      .invite h1 {
        font-size: clamp(2.6rem, 11vw, 4.25rem);
        margin: 0.5rem 0 0.75rem;
      }
      .invite .from {
        font-weight: 600;
        margin: 0;
      }

      /* ---------- Plan ---------- */
      .progress {
        display: flex;
        gap: 6px;
        margin-bottom: 0.6rem;
      }
      .progress span {
        flex: 1;
        height: 8px;
        border-radius: 4px;
        background: var(--ink);
        opacity: 0.2;
      }
      .progress span.on {
        opacity: 1;
      }
      .stepno {
        color: var(--muted);
        font-size: 0.95rem;
        margin-bottom: 1.25rem;
      }
      .q {
        margin-bottom: 0.35rem;
      }
      dl {
        margin: 1rem 0 0;
      }
      .sum {
        display: grid;
        grid-template-columns: 7rem 1fr;
        gap: 0.25rem 1rem;
        padding: 0.7rem 0;
        border-bottom: 1px dashed var(--muted);
      }
      .sum:last-child {
        border-bottom: 0;
      }
      .sum dt {
        font-weight: 600;
      }
      .sum dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .linkbox {
        margin: 0.75rem 0 0;
      }

      /* ---------- Bits ---------- */
      .banner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        background: var(--ink);
        color: var(--paper);
        padding: 0.5rem 0.5rem 0.5rem 1.1rem;
        border-radius: 999px;
        margin-bottom: 1rem;
        font-weight: 500;
        font-size: 0.95rem;
      }
      .banner .btn {
        color: var(--ink);
        background: var(--paper);
        border-color: var(--paper);
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px));
        z-index: 5;
        transform: translate(-50%, 20px);
        opacity: 0;
        pointer-events: none;
        background: var(--ink);
        color: var(--paper);
        padding: 0.7rem 1.1rem;
        border-radius: 999px;
        font-weight: 500;
        transition:
          opacity 0.2s,
          transform 0.2s;
        max-width: 92vw;
        text-align: center;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      /* ---------- Extras ---------- */
      .ps {
        margin: 0.9rem 0 0;
        color: var(--muted);
      }
      .group {
        margin-top: 1.75rem;
      }
      .group h2 {
        margin-bottom: 0.25rem;
      }
      .chip.small {
        min-height: 36px;
        padding: 0.4rem 0.8rem;
        font-size: 0.92rem;
      }
      .ideas {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin-top: 0.5rem;
      }
      .reveal h1 {
        font-size: clamp(2.4rem, 10vw, 3.8rem);
      }

      @media (prefers-reduced-motion: reduce) {
        .shapes {
          animation: none;
        }
        .sh,
        .toast,
        #nobtn,
        .btn {
          transition: none;
        }
      }
    </style>
  </head>
  <body data-screen="create">
    <div class="shapes" aria-hidden="true">
      <div class="sh sh1"></div>
      <svg class="sh sh2" viewBox="0 0 100 100">
        <g style="fill: var(--c)">
          <ellipse cx="50" cy="24" rx="11" ry="22" />
          <ellipse
            cx="50"
            cy="24"
            rx="11"
            ry="22"
            transform="rotate(45 50 50)"
          />
          <ellipse
            cx="50"
            cy="24"
            rx="11"
            ry="22"
            transform="rotate(90 50 50)"
          />
          <ellipse
            cx="50"
            cy="24"
            rx="11"
            ry="22"
            transform="rotate(135 50 50)"
          />
          <ellipse
            cx="50"

            transform="rotate(180 50 50)"
          />
          <ellipse

          />
          <ellipse

            transform="rotate(270 50 50)"
          />
          <ellipse
            cx="50"
            cy="24"
            rx="11"
            ry="22"
            transform="rotate(315 50 50)"
          />
        </g>
        <circle cx="50" cy="50" r="12" style="fill: var(--b)" />
      </svg>
      <div class="sh sh3"></div>
      <div class="sh sh4"></div>
    </div>

    <main class="wrap" id="app"></main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      (function () {
        "use strict";

        var app = document.getElementById("app");
        var toastEl = document.getElementById("toast");
        var SKINS = {
          lilac: { name: "Lilac", dots: ["#DCD0FB", "#FFD866", "#B0124A"] },
          evening: { name: "Evening", dots: ["#1B1030", "#F7C948", "#FFB4C8"] },
          garden: { name: "Garden", dots: ["#CDE8D8", "#F4A6B7", "#1F6B45"] },
        };
        var DEFAULT_Q = "Would you go on a date with me?";
        var TOTAL_STEPS = 8;

        var FOOD = [
          "Filipino",
          "Japanese",
          "Korean",
          "Italian",
          "Chinese",
          "Thai",
          "Steak and grill",
          "Seafood",
          "Burgers and pizza",
          "Vegetarian",

          "Street food",
          "Surprise me",
        ];
        var PLACES = [
          "Café",

          "Museum or gallery",

          "Arcade or games",

        var WHEN = [

        var BUDGET = ["Keep it easy", "Comfortable", "Treat ourselves"];
        var DRINKS = [
          "Coffee",
          "Milk tea",
          "Fruit shake",
          "Wine",
          "Cocktails",
          "Beer",
          "Water is fine",
        ];
        var DESSERTS = [

          "Skip dessert",
        ];
        var AFTER = [

          "Stargazing",
          "Take photos",
          "Dessert run",
          "Movie night at home",
          "Go home early",
          "Nothing planned",
        ];
        var DRESS = [
          "Casual",
          "Smart casual",
          "Dressed up",
          "As comfy as possible",
          "Surprise me",
        ];
        var GETTING = ["Meet there", "Pick me up", "Commute together"];
        var FLIRT = [
          "Can\u2019t wait to see you.",
          "Fair warning: I\u2019m hard to impress. Good luck.",
          "I\u2019ll save you the best seat.",
          "Bring your appetite and your smile.",
          "Don\u2019t be late. I\u2019m already excited.",
        ];
        var PS_IDEAS = [
          "P.S. Say yes and I\u2019ll pick the restaurant.",

          "P.S. I\u2019ve been rehearsing this for days.",
          "P.S. I promise I\u2019m more fun than this website.",
        ];
        var YES_IDEAS = [
          "Good. I was nervous for a second there.",
          "Best answer I could have hoped for.",
          "Now I have something to look forward to.",
          "You just made my day.",
        ];
        var VIBES = [
          ["Simple and relaxed", "Casual, comfy, no pressure"],
          ["Elegant", "Dress up a little, get a nice table"],
          ["Cozy", "A quiet corner and something warm"],
          ["Adventurous", "Try something new together"],
          ["Playful", "Games, laughs, and silly fun"],
        ];

        var prefersDark =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;

        var state = {
          mode: "create",
          screen: "create",
          preview: false,
          step: 0,
          draft: {
            a: "",
            b: "",
            m: DEFAULT_Q,
            s: prefersDark ? "evening" : "lilac",
            d: 0,
            t: 1,
            p: "",
            y: "",
          },
          invite: null,
          link: "",
          ans: {
            food: [],
            avoid: "",
            drinks: [],
            dessert: [],
            vibe: "",
            budget: "",
            places: [],
            ideas: "",
            after: [],
            dress: "",
            getting: "",
            when: [],
            day: "",
            note: "",
            flirt: "",
            flirtOwn: "",
          },
          reply: "",
        };

        /* ---------- helpers ---------- */
        function esc(s) {
          return String(s).replace(/[&<>"']/g, function (c) {
            return {
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[c];
          });
        }
        function encode(o) {
          return encodeURIComponent(
            btoa(unescape(encodeURIComponent(JSON.stringify(o)))),
          );
        }
        function decode(hash) {
          try {
            var m = hash.match(/^#i=(.+)$/);
            if (!m) return null;
            var j = JSON.parse(
              decodeURIComponent(escape(atob(decodeURIComponent(m[1])))),
            );
            if (!j || typeof j.a !== "string" || typeof j.b !== "string")
              return null;
            return {
              a: j.a.slice(0, 40),
              b: j.b.slice(0, 40),
              m: (typeof j.m === "string" && j.m.trim()
                ? j.m
                : DEFAULT_Q
              ).slice(0, 160),
              s: SKINS[j.s] ? j.s : "lilac",
              d: j.d ? 1 : 0,
              t: j.t ? 1 : 0,
              p: typeof j.p === "string" ? j.p.slice(0, 100) : "",
              y: typeof j.y === "string" ? j.y.slice(0, 100) : "",
            };
          } catch (e) {
            return null;
          }
        }
        function setSkin(s) {
          document.documentElement.setAttribute("data-skin", s);
        }
        function toast(msg) {
          toastEl.textContent = msg;
          toastEl.classList.add("show");
          clearTimeout(toast._t);
          toast._t = setTimeout(function () {
            toastEl.classList.remove("show");
          }, 2200);
        }
        function copy(text) {
          var done = function () {
            toast("Copied to your clipboard.");
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done, fallback);
          } else {
            fallback();
          }
          function fallback() {
            var ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            try {
              document.execCommand("copy");
              done();
            } catch (e) {
              toast("Could not copy. Select the text and copy it yourself.");
            }
            ta.remove();
          }
        }
        function share(text, url) {
          if (navigator.share) {
            var data = url ? { text: text, url: url } : { text: text };
            navigator.share(data).catch(function (e) {
              if (e && e.name === "AbortError") return;
              copy(url ? text + " " + url : text);
            });
          } else {
            copy(url ? text + " " + url : text);
          }
        }
        function fmtDay(v) {
          try {
            var d = new Date(v + "T00:00:00");
            return d.toLocaleDateString(undefined, {
              weekday: "long",
              month: "long",
              day: "numeric",
            });
          } catch (e) {
            return v;
          }
        }

        /* ---------- plan + message ---------- */
        function planLines() {
          var A = state.ans,
            out = [];
          function add(k, v) {
            if (v && String(v).trim()) out.push([k, String(v).trim()]);
          }
          add("Food", A.food.join(", "));
          add("Avoid", A.avoid);
          add("Drinks", A.drinks.join(", "));
          add("Dessert", A.dessert.join(", "));
          add("Vibe", A.vibe);
          add("Budget", A.budget);
          add("Places", A.places.join(", "));
          add("Place ideas", A.ideas);
          add("After", A.after.join(", "));
          add("Dress code", A.dress);
          add("Getting there", A.getting);
          add(
            "When",
            [A.when.join(", "), A.day ? fmtDay(A.day) : ""]
              .filter(Boolean)
              .join("; "),
          );
          add("Note", A.note);
          return out;
        }
        function A_flirt() {
          return state.ans.flirtOwn.trim() || state.ans.flirt;
        }
        function yesMessage() {
          var inv = state.invite,
            L = planLines();
          var t =
            "Yes! 💌 I\u2019d love to go on a date with you, " + inv.a + ".";
          if (L.length) {
            t +=
              "\n\nHere\u2019s my plan:\n" +
              L.map(function (r) {
                return "\u2022 " + r[0] + ": " + r[1];
              }).join("\n");
          }
          var line = (A_flirt() || "").trim();
          if (line) t += "\n\n" + line;
          return t + "\n\n\u2014 " + inv.b;
        }
        function waHref(text) {
          return "https://wa.me/?text=" + encodeURIComponent(text);
        }

        /* ---------- UI builders ---------- */
        function chips(key, list, mode) {
          return (
            '<div class="chips" role="group">' +
            list
              .map(function (v) {
                var on =
                  mode === "multi"

                return (
                  '<button type="button" class="chip" data-chip data-key="' +
                  key +
                  '" data-mode="' +
                  mode +
                  '" data-val="' +
                  esc(v) +
                  '" aria-pressed="' +
                  on +
                  '">' +
                  esc(v) +
                  "</button>"
                );
              })
              .join("") +
            "</div>"
          );
        }
        function ideaChips(field, list) {
          return list
            .map(function (t) {
              return (
                '<button type="button" class="chip small" data-fill="' +
                field +
                '" data-text="' +
                esc(t) +
                '">' +
                esc(t) +
                "</button>"
              );
            })
            .join("");
        }
        function tiles() {
          return (
            '<div class="tiles" role="group">' +
            VIBES.map(function (v) {
              var on = state.ans.vibe === v[0];
              return (
                '<button type="button" class="tile" data-chip data-key="vibe" data-mode="single" data-val="' +
                esc(v[0]) +
                '" aria-pressed="' +
                on +
                '"><b>' +
                esc(v[0]) +
                "</b><span>" +
                esc(v[1]) +
                "</span></button>"
              );
            }).join("") +
            "</div>"
          );
        }
        function progress(i) {
          var s = "";
          for (var n = 0; n < TOTAL_STEPS; n++)
            s += '<span class="' + (n <= i ? "on" : "") + '"></span>';
          return (
            '<div class="progress" role="img" aria-label="Step ' +
            (i + 1) +
            " of " +
            TOTAL_STEPS +
            '">' +
            s +
            '</div><p class="stepno">Step ' +
            (i + 1) +
            " of " +
            TOTAL_STEPS +
            "</p>"
          );
        }
        function footer() {
          if (state.preview) return "";
          return '<p class="foot"><a href="#" data-act="own">Make your own invitation</a></p>';
        }
        function banner() {
          if (!state.preview) return "";
          return (
            '<div class="banner"><span>Previewing what ' +
            esc(state.invite.b) +
            ' will see.</span><button type="button" class="btn small" data-act="edit">Back to editing</button></div>'
          );
        }

        /* ---------- screens ---------- */
        function screenCreate() {
          var d = state.draft;
          var skinBtns = Object.keys(SKINS)
            .map(function (k) {
              var s = SKINS[k];
              return (
                '<button type="button" class="skin" data-skin="' +

          var result = "";
          if (state.link) {

              esc(state.link) +

              '<div class="row"><button type="button" class="btn primary" data-act="copylink">Copy link</button>' +
              '<button type="button" class="btn" data-act="sharelink">Share</button></div>' +

            '<header class="hero"><h1>Ask someone on a date</h1>' +

            '<section class="card">' +
            '<div class="field"><label for="f-a">Your name</label><input id="f-a" type="text" data-f="a" maxlength="40" autocomplete="given-name" placeholder="Alex" value="' +
            esc(d.a) +
            '"></div>' +
            '<div class="field"><label for="f-b">Their name</label><input id="f-b" type="text" data-f="b" maxlength="40" placeholder="Sam" value="' +
            esc(d.b) +
            '"></div>' +

            esc(d.m) +

            '<label class="check"><input type="checkbox" data-f="t" ' +
            (d.t ? "checked" : "") +
            "><span>Add a \u201CLet me think about it\u201D option</span></label>" +
            '<label class="check"><input type="checkbox" data-f="d" ' +
            (d.d ? "checked" : "") +
            '><span>Make the No button dodge<span class="hint">It stops dodging after a few tries, so a real No always works.</span></span></label>' +
            "<fieldset><legend>Flirty touches (optional)</legend>" +

            esc(d.p) +
            '">' +
            '<div class="ideas">' +
            ideaChips("p", PS_IDEAS) +
            "</div></div>" +
            '<div class="field"><label for="f-y">A message they see after saying yes</label>' +
            '<input id="f-y" type="text" data-f="y" maxlength="100" placeholder="Shown before they plan the date" value="' +
            esc(d.y) +

            '<div class="ideas">' +
            ideaChips("y", YES_IDEAS) +
            "</div></div></fieldset>" +
            '<p class="error" id="err" role="alert"></p>' +
            '<div class="row"><button type="button" class="btn primary" data-act="make">Create invitation link</button>' +
            '<button type="button" class="btn" data-act="preview">Preview</button></div>' +

        function screenInvite() {

            '<p class="to">Hi ' +

            '<div class="stack">' +
            '<button type="button" class="btn primary big" data-act="yes">Yes</button>' +

              ? '<button type="button" class="linkbtn" data-act="maybe">Let me think about it</button>'

          );

        function screenReply(kind) {
          var inv = state.invite;
          var title =
            kind === "no" ? "Thanks for being honest." : "Take your time.";
          var lead =
            kind === "no"
              ? "A clear answer is kind. Send " +

          return (

            '<button type="button" class="btn" data-act="copyreply">Copy message</button></div>' +

            waHref(state.reply) +
            '">Send on WhatsApp</a></div>' +
            '<div class="stack" style="margin-top:1rem"><button type="button" class="linkbtn" data-act="back-invite">Change my answer</button></div>' +
            "</section>" +

          );
        }

        function screenPlan() {
          var i = state.step,
            inv = state.invite,
            A = state.ans,
            body = "";
          var pick = '<p class="muted">Pick as many as you like.</p>';
          if (i === 0) {
            body =
              '<h1 class="q">What are you in the mood to eat?</h1><p class="muted">You said yes. Now for the fun part. Pick as many as you like.</p>' +
              chips("food", FOOD, "multi") +
              '<div class="field" style="margin-top:1.25rem"><label for="avoid">Anything you\u2019d rather avoid?</label>' +
              '<input id="avoid" type="text" data-a="avoid" maxlength="120" placeholder="Allergies, foods you dislike" value="' +
              esc(A.avoid) +
              '"></div>';
          } else if (i === 1) {
            body =
              '<h1 class="q">Drinks and dessert?</h1>' +
              pick +
              '<div class="group"><h2>What are we drinking?</h2>' +
              chips("drinks", DRINKS, "multi") +
              "</div>" +
              '<div class="group"><h2>And for dessert?</h2>' +
              chips("dessert", DESSERTS, "multi") +

          } else if (i === 2) {

              '<h1 class="q">What kind of date sounds right?</h1><p class="muted">Choose the feeling you\u2019d like.</p>' +
              tiles() +
              "<h2>What\u2019s the budget feeling?</h2>" +
              chips("budget", BUDGET, "single");
          } else if (i === 3) {
            body =
              '<h1 class="q">Where would you like to go?</h1>' +

              chips("places", PLACES, "multi") +
              '<div class="field" style="margin-top:1.25rem"><label for="ideas">Have a specific place in mind?</label>' +
              '<input id="ideas" type="text" data-a="ideas" maxlength="120" placeholder="A caf\u00e9 you\u2019ve been wanting to try" value="' +
              esc(A.ideas) +
              '"></div>';
          } else if (i === 4) {
            body =
              '<h1 class="q">What should we do after?</h1>' +

              chips("dress", DRESS, "single") +
              "</div>" +
              '<div class="group"><h2>How do we get there?</h2>' +

              "</div>";
          } else if (i === 6) {
            body =
              '<h1 class="q">When works for you?</h1>' +
              pick +
              chips("when", WHEN, "multi") +
              '<div class="field" style="margin-top:1.25rem"><label for="day">A specific day, if you have one</label>' +
              '<input id="day" type="date" data-a="day" value="' +
              esc(A.day) +
              '"></div>';
          } else {
            body =
              '<h1 class="q">Anything else for ' +
              esc(inv.a) +
              '?</h1><p class="muted">Both parts are optional.</p>' +
              '<div class="field"><label for="note">A note</label>' +
              '<textarea id="note" data-a="note" rows="3" maxlength="300" placeholder="A song to play, a joke, a request">' +
              esc(A.note) +
              "</textarea></div>" +
              '<div class="group"><h2>Add a little something</h2><p class="muted">Pick a line to end your message with, or write your own.</p>' +
              chips("flirt", FLIRT, "single") +
              '<div class="field" style="margin-top:1rem"><label for="flirtOwn">Or write your own</label>' +
              '<input id="flirtOwn" type="text" data-a="flirtOwn" maxlength="100" value="' +
              esc(A.flirtOwn) +
              '"></div></div>';
          }
          return (
            banner() +
            '<section class="card">' +
            progress(i) +
            body +
            '<div class="row"><button type="button" class="btn" data-act="prev">Back</button>' +
            '<button type="button" class="btn primary" data-act="next">' +
            (i === TOTAL_STEPS - 1 ? "See my plan" : "Next") +
            "</button></div>" +
            "</section>" +
            footer()
          );
        }

        function screenReveal() {
          var inv = state.invite;
          return (
            banner() +
            '<section class="card invite reveal">' +
            '<p class="to">' +
            esc(inv.a) +
            " says:</p>" +
            "<h1>" +
            esc(inv.y) +
            "</h1>" +
            '<div class="stack"><button type="button" class="btn primary big" data-act="startplan">Plan our date</button></div>' +
            "</section>" +
            footer()
          );
        }

        function screenDone() {
          var inv = state.invite,
            L = planLines(),
            msg = yesMessage();
          var rows = L.length
            ? "<dl>" +
              L.map(function (r) {
                return (
                  '<div class="sum"><dt>' +

                  "</dt><dd>" +
                  esc(r[1]) +
                  "</dd></div>"
                );
              }).join("") +
              "</dl>"
            : '<p class="muted">You didn\u2019t pick any details, so ' +
              esc(inv.a) +
              " will get a simple yes.</p>";
          return (
            banner() +
            '<section class="card"><h1>Your plan is ready</h1>' +
            "<p>Send it to " +
            esc(inv.a) +
            " and they\u2019ll take it from there.</p>" +
            rows +
            '<div class="row"><button type="button" class="btn primary" data-act="sendyes">Send to ' +
            esc(inv.a) +
            "</button>" +
            '<button type="button" class="btn" data-act="copyyes">Copy message</button></div>' +
            '<div class="row" style="margin-top:.75rem"><a class="btn" target="_blank" rel="noopener" href="' +
            waHref(msg) +
            '">Send on WhatsApp</a></div>' +
            '<div class="stack" style="margin-top:1rem"><button type="button" class="linkbtn" data-act="editplan">Edit my answers</button></div>' +
            "</section>" +

          );
        }

        /* ---------- render ---------- */
        function render() {
          var s = state.screen,
            shapeKey;
          if (s === "create") shapeKey = "create";
          else if (s === "plan") shapeKey = "plan";
          else if (s === "done") shapeKey = "done";
          else shapeKey = "invite";
          document.body.setAttribute("data-screen", shapeKey);
          setSkin(state.mode === "invite" ? state.invite.s : state.draft.s);

          var html;
          if (s === "create") html = screenCreate();
          else if (s === "invite") html = screenInvite();
          else if (s === "reveal") html = screenReveal();
          else if (s === "no" || s === "maybe") html = screenReply(s);
          else if (s === "plan") html = screenPlan();
          else html = screenDone();
          app.innerHTML = html;

          document.title =
            state.mode === "invite"
              ? state.invite.a + " has a question for you"
              : "Ask someone on a date";

          var h = app.querySelector("h1");
          if (h) {
            h.setAttribute("tabindex", "-1");
            h.focus({ preventScroll: true });
          }
          window.scrollTo(0, 0);
          dodges = 0;
        }

        /* ---------- actions ---------- */
        var dodges = 0,
          lastDodge = 0;
        function dodge(btn) {
          dodges++;
          lastDodge = Date.now();
          var x = (Math.random() < 0.5 ? -1 : 1) * (50 + Math.random() * 60);
          var y = (Math.random() < 0.5 ? -1 : 1) * (30 + Math.random() * 50);
          btn.style.transform = "translate(" + x + "px," + y + "px)";
        }
        function dodgeOn() {
          return state.invite && state.invite.d && dodges < 5;
        }

        function validateDraft() {
          var d = state.draft,
            err = document.getElementById("err");
          if (!d.a.trim() || !d.b.trim()) {
            err.textContent =
              "Add both names so the invitation feels personal.";
            var target = document.getElementById(!d.a.trim() ? "f-a" : "f-b");
            if (target) target.focus();
            return false;
          }
          err.textContent = "";
          return true;
        }
        function draftToInvite() {
          var d = state.draft;
          return {
            a: d.a.trim(),
            b: d.b.trim(),
            m: d.m.trim() || DEFAULT_Q,
            s: d.s,
            d: d.d ? 1 : 0,
            t: d.t ? 1 : 0,
            p: d.p.trim(),
            y: d.y.trim(),
          };
        }

        function act(name, el, ev) {
          var inv = state.invite;
          switch (name) {
            case "make":
              if (!validateDraft()) return;
              var payload = draftToInvite();
              state.link =
                location.href.split("#")[0] + "#i=" + encode(payload);
              render();
              var r = document.getElementById("result");
              if (r) {
                var calm =
                  window.matchMedia &&
                  window.matchMedia("(prefers-reduced-motion: reduce)").matches;
                r.scrollIntoView({
                  behavior: calm ? "auto" : "smooth",
                  block: "start",
                });
              }
              break;
            case "preview":
              if (!validateDraft()) return;
              state.invite = draftToInvite();
              state.mode = "invite";
              state.preview = true;
              state.screen = "invite";
              state.step = 0;
              render();
              break;
            case "edit":
              state.mode = "create";
              state.preview = false;
              state.screen = "create";
              render();
              break;
            case "copylink":
              copy(state.link);
              break;
            case "sharelink":
              share(
                state.draft.a.trim() + " has a question for you.",
                state.link,
              );
              break;
            case "yes":
              state.screen = inv.y ? "reveal" : "plan";
              state.step = 0;
              render();
              break;
            case "startplan":
              state.screen = "plan";
              state.step = 0;
              render();
              break;
            case "no":
              if (dodgeOn() && ev && ev.detail !== 0) {
                dodge(el);
                return;
              }
              state.reply =
                "Hi " +
                inv.a +
                ", thank you for asking. I\u2019m going to say no, but I appreciate that you asked.";
              state.screen = "no";
              render();
              break;
            case "maybe":
              state.reply =
                "Hi " +
                inv.a +
                ", I\u2019d like a little time to think about it. Can I get back to you soon?";
              state.screen = "maybe";
              render();
              break;
            case "back-invite":
              state.screen = "invite";
              render();
              break;
            case "sendreply":
              share(state.reply);
              break;
            case "copyreply":
              copy(state.reply);
              break;
            case "prev":
              if (state.step === 0) {
                state.screen = "invite";
              } else {
                state.step--;
              }
              render();
              break;
            case "next":
              if (state.step < TOTAL_STEPS - 1) {
                state.step++;
                state.screen = "plan";
              } else {
                state.screen = "done";
              }
              render();
              break;
            case "editplan":
              state.screen = "plan";
              state.step = 0;
              render();
              break;
            case "sendyes":
              share(yesMessage());
              break;
            case "copyyes":
              copy(yesMessage());
              break;
            case "own":
              try {
                history.replaceState(
                  null,
                  "",
                  location.pathname + location.search,
                );
              } catch (e) {
                location.hash = "";
              }
              init();
              break;
          }
        }

        /* ---------- events ---------- */
        document.addEventListener("click", function (e) {
          var chip = e.target.closest("[data-chip]");
          if (chip) {
            var key = chip.dataset.key,
              val = chip.dataset.val;
            if (chip.dataset.mode === "multi") {
              var arr = state.ans[key],
                i = arr.indexOf(val);
              if (i > -1) arr.splice(i, 1);
              else arr.push(val);
              chip.setAttribute("aria-pressed", String(i === -1));
            } else {
              state.ans[key] = state.ans[key] === val ? "" : val;
              document
                .querySelectorAll('[data-chip][data-key="' + key + '"]')
                .forEach(function (x) {
                  x.setAttribute(
                    "aria-pressed",
                    String(state.ans[key] === x.dataset.val),
                  );
                });
            }
            return;
          }
          var fill = e.target.closest("button[data-fill]");
          if (fill) {
            var fk = fill.dataset.fill;
            state.draft[fk] = fill.dataset.text;
            var box = document.getElementById("f-" + fk);
            if (box) {
              box.value = fill.dataset.text;
              box.focus();
            }
            return;
          }
          var skin = e.target.closest("button.skin");
          if (skin) {
            state.draft.s = skin.dataset.skin;
            setSkin(state.draft.s);
            document.querySelectorAll(".skin").forEach(function (x) {
              x.setAttribute(
                "aria-pressed",
                String(x.dataset.skin === state.draft.s),
              );
            });
            return;
          }
          var a = e.target.closest("[data-act]");
          if (a) {
            if (a.tagName === "A") e.preventDefault();
            act(a.dataset.act, a, e);
          }
        });

        document.addEventListener("pointerover", function (e) {
          var b = e.target.closest && e.target.closest("#nobtn");
          if (
            b &&
            e.pointerType === "mouse" &&
            dodgeOn() &&
            Date.now() - lastDodge > 250
          )
            dodge(b);
        });

        document.addEventListener("input", function (e) {
          var t = e.target;
          if (t.dataset.f) {
            state.draft[t.dataset.f] =
              t.type === "checkbox" ? (t.checked ? 1 : 0) : t.value;
          } else if (t.dataset.a) {
            state.ans[t.dataset.a] = t.value;
          } else if (t.dataset.r !== undefined) {
            state.reply = t.value;
            var wa = document.getElementById("wa");
            if (wa) wa.href = waHref(state.reply);
          }
        });

        document.addEventListener("focusin", function (e) {
          if (e.target.id === "linkbox") e.target.select();
        });

        window.addEventListener("hashchange", function () {
          init();
        });

        /* ---------- start ---------- */
        function init() {
          var inv = decode(location.hash);
          state.preview = false;
          state.step = 0;
          state.link = "";
          if (inv) {
            state.invite = inv;
            state.mode = "invite";
            state.screen = "invite";
          } else {
            state.mode = "create";
            state.screen = "create";
          }
          render();
        }
        init();
      })();
    </script>
  </body>
</html>
