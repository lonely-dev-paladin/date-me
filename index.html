<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Will you go on a date with me?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/main.css" />
    <link rel="icon" type="image/png" href="assets/images/favicon.jpg" />
  </head>
  <body data-screen="create">
    <div class="shapes" aria-hidden="true">
      <div class="sh sh1"></div>
      <svg class="sh sh2" viewBox="0 0 100 100">
        <g style="fill: var(--c)">
          <ellipse cx="50" cy="24" rx="11" ry="22" />
          <ellipse
            cx="50"
            cy="24"
            rx="11"
            ry="22"
            transform="rotate(45 50 50)"
          />
          <ellipse
            cx="50"
            cy="24"
            rx="11"
            ry="22"
            transform="rotate(90 50 50)"
          />
          <ellipse
            cx="50"
            cy="24"
            rx="11"
            ry="22"
            transform="rotate(135 50 50)"
          />
          <ellipse
            cx="50"
            cy="24"
            rx="11"
            ry="22"
            transform="rotate(180 50 50)"
          />
          <ellipse
            cx="50"
            cy="24"
            rx="11"
            ry="22"
            transform="rotate(225 50 50)"
          />
          <ellipse
            cx="50"
            cy="24"
            rx="11"
            ry="22"
            transform="rotate(270 50 50)"
          />
          <ellipse
            cx="50"
            cy="24"
            rx="11"
            ry="22"
            transform="rotate(315 50 50)"
          />
        </g>
        <circle cx="50" cy="50" r="12" style="fill: var(--b)" />
      </svg>
      <div class="sh sh3"></div>
      <div class="sh sh4"></div>
    </div>

    <main class="wrap" id="app"></main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="assets/js/main.js"></script>
  </body>
</html>
