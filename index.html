<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <meta
      name="description"
      content="First move matters, take your shot before someone hit you eacake!"
    />
    <meta property="og:title" content="PLanning for a date?" />
    <meta
      property="og:description"
      content="First move matters, take your shot before someone takes a hit!"
    />
    <meta
      property="og:image"
      content="https://date-me-rhbn.onrender.com/assets/images/preview-image.jpg"
    />
    <meta property="og:url" content="https://date-me-rhbn.onrender.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="......" />

    <title>Will you go on a date with me?</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Loaded in dependency order: tokens first (every other file reads
       these variables), then base elements, then the two systems built
       on top of them. -->
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/photo-screens.css" />
    <link rel="stylesheet" href="assets/css/transitions.css" />
    <link rel="icon" type="jpeg/png" href="assets/images/favicon.jpg" />
  </head>
  <body>
    <!-- Soft drifting shapes behind non-photo screens (the create form,
       most planner steps, the summary). Hidden automatically by
       app.js/transitions.css whenever a photo screen is showing. -->
    <div class="shapes" aria-hidden="true">
      <div class="sh sh1"></div>
      <svg class="sh sh2" viewBox="0 0 100 100">
        <g style="fill: var(--c)">
          <ellipse cx="50" cy="24" rx="11" ry="22" />
          <ellipse
            cx="50"
            cy="24"
            rx="11"
            ry="22"
            transform="rotate(45 50 50)"
          />
          <ellipse
            cx="50"
            cy="24"
            rx="11"
            ry="22"
            transform="rotate(90 50 50)"
          />
          <ellipse
            cx="50"
            cy="24"
            rx="11"
            ry="22"
            transform="rotate(135 50 50)"
          />
          <ellipse
            cx="50"
            cy="24"
            rx="11"
            ry="22"
            transform="rotate(180 50 50)"
          />
          <ellipse
            cx="50"
            cy="24"
            rx="11"
            ry="22"
            transform="rotate(225 50 50)"
          />
          <ellipse
            cx="50"
            cy="24"
            rx="11"
            ry="22"
            transform="rotate(270 50 50)"
          />
          <ellipse
            cx="50"
            cy="24"
            rx="11"
            ry="22"
            transform="rotate(315 50 50)"
          />
        </g>
        <circle cx="50" cy="50" r="12" style="fill: var(--b)" />
      </svg>
      <div class="sh sh3"></div>
      <div class="sh sh4"></div>
    </div>

    <!-- Every screen's HTML is generated by js/app.js and injected here,
       through js/transitions.js's mountScreen()/switchScreen(). -->
    <main class="wrap" id="app"></main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- type="module" so app.js can import photos.js and transitions.js
       directly — no bundler needed. -->
    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
